packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  # hooks are installed by `prepare` (`lefthook install`), not by postinstall
  lefthook: false
  msgpackr-extract: true
  workerd: true

catalog:
  # toolchain
  typescript: ^7.0.2
  vite-plus: ^1.0.0
  # `vite` is an alias of the core bundled by vite-plus (Vite 8 inside)
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  # keep in sync with the versions bundled by vite-plus
  vitest: 5.0.1
  oxfmt: 0.70.0
  oxlint: 1.85.0
  "@types/node": ^26.3.0
  # web
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.102.8
  react-hook-form: ^7.86.0
  "@hookform/resolvers": ^5.9.1
  # api (Cloudflare Worker deployed with Alchemy)
  alchemy: 2.0.0-beta.80
  "@cloudflare/workers-types": 5.20260918.1
  effect: 4.0.0
  "@effect/platform-node": 4.0.0
  "@effect/sql-d1": 4.0.0
  "@effect/vitest": 4.0.0
  # keep in sync with the drizzle build alchemy's Drizzle integration expects
  drizzle-orm: 1.0.0-rc.5-ab785fc
  drizzle-kit: 1.0.0-rc.5-ab785fc

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.102.8"
  - "@tanstack/react-query@5.102.8"

# Recommended by vite-plus: every package resolves the same Vite and Vitest
# that `vp` bundles. Keep both in step with the vite-plus catalog version.
overrides:
  "vite@*": npm:@voidzero-dev/vite-plus-core@1.0.0
  "vitest@*": 5.0.1

peerDependencyRules:
  allowedVersions:
    # the `vite` alias is versioned like vite-plus (1.x) but bundles Vite 8
    vite: 1.0.0
